# Tooling configuration only (the project is run from source, not installed as a package).

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["venv", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]
# B008: FastAPI declares dependencies as Depends(...) argument defaults by design.
ignore = ["UP006", "UP007", "UP035", "UP045", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
